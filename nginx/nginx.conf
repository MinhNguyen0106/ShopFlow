# ==============================================================================
# ShopFlow - Nginx Main Configuration (TASK-26.3)
# File: nginx/nginx.conf
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log chuẩn JSON cho APM / Centralized Logging
    log_format main_json escape=json '{'
        '"time_local":"$time_local",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status": "$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for"'
    '}';

    access_log /var/log/nginx/access.log main_json;

    # Tối ưu hóa I/O
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Bảo mật: Ẩn phiên bản Nginx
    server_tokens off;

    # Giới hạn kích thước upload (cho phép video/ảnh Cloudinary và Meta Webhooks)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Cấu hình nén Gzip ở tầng Nginx
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Đọc cấu hình các virtual hosts
    include /etc/nginx/conf.d/*.conf;
}
