# ==============================================================================
# ShopFlow - Production Docker Compose Environment (TASK-26.3)
# File: docker-compose.prod.yml
# ==============================================================================
#
# Khởi chạy toàn bộ hệ thống Production:
#   docker-compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Kiểm tra tình trạng các containers:
#   docker-compose -f docker-compose.prod.yml ps
#
# Dừng cụm container an toàn:
#   docker-compose -f docker-compose.prod.yml down
# ==============================================================================

version: "3.9"

services:
  # ============================================================================
  # 1. PostgreSQL 15 - Cơ sở dữ liệu chính
  # ============================================================================
  postgres:
    image: postgres:15-alpine
    container_name: shopflow_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopflow_production}
      POSTGRES_USER: ${POSTGRES_USER:-shopflow_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
      - ./backend/src/infrastructure/database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopflow_admin} -d ${POSTGRES_DB:-shopflow_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    networks:
      - shopflow_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 2. Redis 7 - BullMQ Hàng Đợi & Caching Layer
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: shopflow_prod_redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 256mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:?Vui lòng cấu hình REDIS_PASSWORD}
      --loglevel notice
    volumes:
      - redisdata_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    networks:
      - shopflow_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 3. Express.js Backend Service
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopflow_prod_backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql://${POSTGRES_USER:-shopflow_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-shopflow_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CORS_ORIGIN: ${APP_URL:-https://shopflow.vn}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_VERIFY_TOKEN: ${FACEBOOK_VERIFY_TOKEN:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - shopflow_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 4. Next.js 14 Frontend Service (Standalone Runner)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopflow_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_SOCKET_URL: /
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    networks:
      - shopflow_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ============================================================================
  # 5. Nginx Reverse Proxy & API Gateway (Port 80/443 Cổng Vào Duy Nhất)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: shopflow_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    networks:
      - shopflow_prod_network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# ==============================================================================
# Persistent Volumes
# ==============================================================================
volumes:
  pgdata_prod:
    name: shopflow_pgdata_prod
    driver: local
  redisdata_prod:
    name: shopflow_redisdata_prod
    driver: local

# ==============================================================================
# Isolated Production Network
# ==============================================================================
networks:
  shopflow_prod_network:
    name: shopflow_prod_network
    driver: bridge
